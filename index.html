<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, viewport-fit=cover" />
  <title>Pocket Kirtans</title>

  <!-- PWA & Mobile Meta -->
  <meta name="description" content="Minimalist, distraction-free Swaminarayan Kirtans, Aarti, Chesta & Nitya Niyam reader." />
  <meta name="theme-color" content="#000000" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Pocket Kirtans" />

  <!-- Icons -->
  <link rel="icon" type="image/svg+xml" href="assets/icon.svg" />
  <link rel="icon" type="image/png" sizes="32x32" href="assets/favicon-32.png" />
  <link rel="apple-touch-icon" href="assets/apple-touch-icon.png" />
  <link rel="manifest" href="manifest.json" />

  <!-- Fonts & Stylesheet -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Gujarati:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>

  <!-- Top Glass Header -->
  <header class="navbar">
    <div class="nav-brand" onclick="switchTab('nitya')">
      <div class="nav-icon">
        <svg viewBox="0 0 100 100" width="24" height="24" fill="currentColor">
          <path d="M 50 16 C 57 32, 63 44, 61 56 C 59 66, 51 70, 50 70 C 49 70, 41 66, 39 56 C 37 44, 43 32, 50 16 Z" />
          <path d="M 50 76 C 42 72, 31 72, 22 76 L 22 83 C 31 79, 42 79, 50 83 Z" />
          <path d="M 50 76 C 58 72, 69 72, 78 76 L 78 83 C 69 79, 58 79, 50 83 Z" />
          <circle cx="50" cy="50" r="44" fill="none" stroke="currentColor" stroke-width="3" stroke-dasharray="2 3" opacity="0.3" />
        </svg>
      </div>
      <span class="nav-title">Pocket Kirtans</span>
    </div>

    <div class="nav-actions">
      <!-- Script Toggle Segmented Pill -->
      <div class="script-toggle-bar">
        <button class="script-pill" data-script="gu">ગુજ</button>
        <button class="script-pill" data-script="en">Eng</button>
        <button class="script-pill active" data-script="both">Both</button>
      </div>

      <!-- Font Size Button -->
      <button class="icon-btn" id="fontsize-btn" title="Adjust text size">
        <span style="font-weight:700; font-size: 0.8rem;">A±</span>
      </button>

      <!-- Theme Switcher (OLED Dark / Pure Light) -->
      <button class="icon-btn" id="theme-btn" title="Toggle Dark/Light Mode">
        <span id="theme-icon">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <circle cx="12" cy="12" r="5"/>
            <line x1="12" y1="1" x2="12" y2="3"/>
            <line x1="12" y1="21" x2="12" y2="23"/>
            <line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/>
            <line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/>
            <line x1="1" y1="12" x2="3" y2="12"/>
            <line x1="21" y1="12" x2="23" y2="12"/>
            <line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/>
            <line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/>
          </svg>
        </span>
      </button>
    </div>
  </header>

  <!-- Main Viewports -->
  <main class="main-content">
    
    <!-- Tab 1: Nitya Niyam -->
    <section id="tab-nitya" class="tab-view">
      <div id="nitya-container">
        <div class="spinner"></div>
      </div>
    </section>

    <!-- Tab 2: Chesta & Shayan -->
    <section id="tab-shayan" class="tab-view" style="display: none;">
      <div id="shayan-container">
        <div class="spinner"></div>
      </div>
    </section>

    <!-- Tab 3: Saints Catalog -->
    <section id="tab-saints" class="tab-view" style="display: none;">
      <div id="saints-list-view">
        <div id="saints-container">
          <div class="spinner"></div>
        </div>
      </div>
      
      <!-- Saint Detail Drilldown -->
      <div id="saint-detail-view" style="display: none;">
        <div class="section-title-wrap" style="display: flex; align-items: center; gap: 12px; margin-bottom: 20px;">
          <button class="icon-btn" id="saint-back-btn" title="Back to Saints">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <line x1="19" y1="12" x2="5" y2="12"/>
              <polyline points="12 19 5 12 12 5"/>
            </svg>
          </button>
          <div>
            <h1 class="section-title" id="saint-detail-title-gu" style="font-size: 1.35rem;"></h1>
            <div class="section-label" id="saint-detail-title-en"></div>
          </div>
        </div>
        <div id="saint-detail-container"></div>
      </div>
    </section>

    <!-- Tab 4: Search -->
    <section id="tab-search" class="tab-view" style="display: none;">
      <div class="search-wrapper">
        <svg class="search-icon-svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <circle cx="11" cy="11" r="8"/>
          <line x1="21" y1="21" x2="16.65" y2="16.65"/>
        </svg>
        <input type="text" id="search-input" class="search-input" placeholder="Search across 1,487 kirtans & prayers..." autocomplete="off" />
        <button id="clear-search-btn" class="clear-search-btn" title="Clear">✕</button>
      </div>
      <div id="search-container"></div>
    </section>

    <!-- Tab 5: Saved Favorites -->
    <section id="tab-saved" class="tab-view" style="display: none;">
      <div id="saved-container"></div>
    </section>

  </main>

  <!-- Reader View Overlay -->
  <div id="reader-view" class="reader-view">
    <div class="reader-navbar">
      <button class="reader-back-btn" id="reader-back-btn">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <line x1="19" y1="12" x2="5" y2="12"/>
          <polyline points="12 19 5 12 12 5"/>
        </svg>
        <span>Back</span>
      </button>

      <div class="reader-controls">
        <div class="script-toggle-bar">
          <button class="reader-script-pill script-pill" data-script="gu">ગુજ</button>
          <button class="reader-script-pill script-pill" data-script="en">Eng</button>
          <button class="reader-script-pill script-pill active" data-script="both">Both</button>
        </div>

        <button class="icon-btn" id="reader-fontsize-btn" title="Text size">
          <span style="font-weight:700; font-size: 0.8rem;">A±</span>
        </button>

        <button class="icon-btn" id="reader-bookmark-btn" title="Save / Bookmark">
          <span id="reader-bookmark-icon">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"/>
            </svg>
          </span>
        </button>
      </div>
    </div>

    <div class="reader-content">
      <div class="reader-header">
        <div class="reader-tag-row" id="reader-tags"></div>
        <h1 class="reader-title-gu" id="reader-title-gu"></h1>
        <h2 class="reader-title-en" id="reader-title-en"></h2>
        <div class="reader-author" id="reader-author"></div>
      </div>

      <div class="lyrics-container" id="reader-lyrics"></div>

      <!-- Next / Prev Pad Navigation Footer -->
      <div class="reader-nav-footer">
        <button class="padv-btn" id="reader-prev-btn">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <line x1="19" y1="12" x2="5" y2="12"/>
            <polyline points="12 19 5 12 12 5"/>
          </svg>
          <span>Previous</span>
        </button>
        <button class="padv-btn" id="reader-next-btn">
          <span>Next</span>
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <line x1="5" y1="12" x2="19" y2="12"/>
            <polyline points="12 5 19 12 12 19"/>
          </svg>
        </button>
      </div>
    </div>
  </div>

  <!-- iOS-Style Floating Glass Bottom Navigation -->
  <nav class="bottom-nav">
    <button class="nav-tab active" data-tab="nitya">
      <svg class="nav-tab-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor">
        <path d="M12 2v20M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6"/>
      </svg>
      <span class="nav-tab-label">Nitya</span>
    </button>

    <button class="nav-tab" data-tab="shayan">
      <svg class="nav-tab-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor">
        <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/>
      </svg>
      <span class="nav-tab-label">Shayan</span>
    </button>

    <button class="nav-tab" data-tab="saints">
      <svg class="nav-tab-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor">
        <path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/>
        <path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"/>
      </svg>
      <span class="nav-tab-label">Saints</span>
    </button>

    <button class="nav-tab" data-tab="search">
      <svg class="nav-tab-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor">
        <circle cx="11" cy="11" r="8"/>
        <line x1="21" y1="21" x2="16.65" y2="16.65"/>
      </svg>
      <span class="nav-tab-label">Search</span>
    </button>

    <button class="nav-tab" data-tab="saved">
      <svg class="nav-tab-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor">
        <path d="M19 21l-7-5-7 5V5a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2z"/>
      </svg>
      <span class="nav-tab-label">Saved</span>
    </button>
  </nav>

  <script src="app.js"></script>
</body>
</html>
